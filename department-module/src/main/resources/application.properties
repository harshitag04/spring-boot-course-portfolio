spring.application.name=department-service

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.h2.console.settings.web-allow-others=true

# 1. Change 'mem' to 'file' and specify a file path (creates a folder named 'data' in your project root)
spring.datasource.url=jdbc:h2:file:./data/departmentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=harshit
spring.datasource.password=harshit@123

# 3. CRITICAL: Stop Hibernate from dropping your database tables on every startup
spring.jpa.hibernate.ddl-auto=update

